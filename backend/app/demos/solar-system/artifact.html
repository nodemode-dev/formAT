<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orrery</title>
<style>
  :root { --ink: #eef0fb; --ink2: #b9c0dc; --dim: #8089ab; --line: rgba(150, 165, 255, 0.2); --glass: rgba(12, 13, 30, 0.72); --amber: #ffcf7a;
    --ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #03030a; overflow: hidden; }
  body { position: fixed; inset: 0; font-family: var(--ui); color: var(--ink); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #gl, #flat { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; outline: none; }
  #gl.drag { cursor: grabbing; } #gl.hot { cursor: pointer; }
  #flat { display: none; }
  #labels { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .lab { position: absolute; left: 0; top: 0; padding: 3px 6px; font-size: 9.5px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; white-space: nowrap; color: rgba(225, 230, 255, 0.82);
    opacity: 0; transition: opacity 0.25s ease, color 0.15s ease; will-change: transform, opacity; pointer-events: none; cursor: pointer; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9); }
  .lab.on { pointer-events: auto; } .lab.moon { font-size: 8.5px; letter-spacing: 0.13em; color: rgba(205, 212, 240, 0.78); }
  .lab.hot { color: #fff; }
  .lab::before { content: ""; position: absolute; left: -3px; top: 50%; width: 5px; height: 1px; background: currentColor; opacity: 0.6; }
  .glass { background: var(--glass); border: 1px solid var(--line); box-shadow: 0 10px 34px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.05); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .brand { position: absolute; left: 18px; top: 14px; pointer-events: none; }
  .brand b { display: block; font-size: 15px; font-weight: 400; letter-spacing: 0.42em; }
  .brand span { display: block; margin-top: 6px; font-size: 8.5px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--dim); }
  .when { position: absolute; top: 14px; left: 0; width: 100%; text-align: center; pointer-events: none; }
  .when b { display: block; font-size: 15px; font-weight: 500; letter-spacing: 0.16em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .when span { display: block; margin-top: 6px; height: 11px; font-size: 8.5px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
  button { all: unset; box-sizing: border-box; cursor: pointer; font-family: var(--ui); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; border-radius: 6px; }
  #bodies { position: absolute; left: 12px; top: 62px; width: 148px; padding: 6px; border-radius: 12px; display: flex; flex-direction: column; gap: 1px; }
  #bodies button { display: flex; align-items: center; gap: 8px; height: 25px; padding: 0 8px; border-radius: 7px; font-size: 11.5px; color: var(--ink2); white-space: nowrap; transition: background 0.15s ease, color 0.15s ease; }
  #bodies button i { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--c, #888); box-shadow: 0 0 6px var(--c, #888); }
  #bodies button:hover, #bodies button.hot { background: rgba(255, 255, 255, 0.07); color: #fff; }
  #bodies button[aria-current="true"] { background: rgba(255, 207, 122, 0.13); color: #fff; box-shadow: inset 0 0 0 1px rgba(255, 207, 122, 0.4); }
  #bodies .sys { color: var(--ink); font-weight: 500; margin-bottom: 3px; }
  #bodies .sys svg { width: 12px; height: 12px; flex: none; margin: 0 -2px; }
  #moons { position: absolute; left: 12px; top: 356px; width: 148px; padding: 6px; border-radius: 12px; display: flex; flex-direction: column; gap: 1px; transition: opacity 0.25s ease; }
  #moons.off { opacity: 0; pointer-events: none; }
  #moons em { font-style: normal; font-size: 8.5px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--dim); padding: 2px 8px 4px; }
  #moons button { display: flex; align-items: center; gap: 8px; height: 22px; padding: 0 8px; border-radius: 7px; font-size: 11px; color: var(--ink2); white-space: nowrap; transition: background 0.15s ease, color 0.15s ease; }
  #moons button i { width: 6px; height: 6px; border-radius: 50%; flex: none; background: var(--c, #888); }
  #moons button:hover, #moons button.hot { background: rgba(255, 255, 255, 0.07); color: #fff; }
  #moons button[aria-current="true"] { background: rgba(255, 207, 122, 0.13); color: #fff; box-shadow: inset 0 0 0 1px rgba(255, 207, 122, 0.4); }
  #info { position: absolute; right: 12px; top: 12px; bottom: 70px; width: 292px; border-radius: 14px; padding: 16px 16px 12px; display: flex; flex-direction: column; overflow: hidden; }
  #info .kind { font-size: 8.5px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--amber); height: 11px; }
  #info h1 { margin: 5px 0 0; font-size: 24px; font-weight: 300; letter-spacing: 0.08em; height: 30px; white-space: nowrap; }
  #info .tag { margin: 3px 0 0; font-size: 11.5px; color: var(--ink2); height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #stats { margin: 12px 0 0; padding: 0; display: grid; grid-template-columns: 1fr; gap: 0; }
  #stats div { display: grid; grid-template-columns: 92px minmax(0, 1fr); align-items: center; column-gap: 8px; height: 25px; border-top: 1px solid rgba(150, 165, 255, 0.11); font-size: 11.5px; }
  #stats dt { color: var(--dim); white-space: nowrap; } #stats dd { margin: 0; text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #stats div[hidden] { display: grid; visibility: hidden; }
  #about { margin: 10px 0 0; font-size: 12px; line-height: 1.5; color: var(--ink2); flex: 1; min-height: 0; overflow: hidden; }
  #cmp { width: 100%; height: 52px; flex: none; margin-top: 6px; } #cmp text { font-size: 10px; fill: var(--dim); font-family: var(--ui); } #cmp[data-off="1"] { visibility: hidden; }
  .note { margin-top: 8px; padding-top: 9px; border-top: 1px solid rgba(150, 165, 255, 0.11); font-size: 10.5px; line-height: 1.45; color: var(--dim); display: flex; gap: 10px; align-items: center; }
  .note span { flex: 1; }
  .pill { height: 26px; padding: 0 11px; border-radius: 13px; display: inline-flex; align-items: center; gap: 7px; font-size: 9.5px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(228, 232, 255, 0.9);
    border: 1px solid rgba(150, 165, 255, 0.26); background: rgba(255, 255, 255, 0.03); white-space: nowrap; transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease; }
  .pill:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(180, 190, 255, 0.5); }
  .pill[aria-pressed="true"] { color: #fff; border-color: rgba(255, 207, 122, 0.6); background: rgba(255, 207, 122, 0.12); }
  .pill svg { width: 10px; height: 10px; flex: none; }
  .bar { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 8px; border-radius: 21px; max-width: calc(100% - 16px); }
  #play { width: 82px; justify-content: center; }
  #tour { width: 78px; justify-content: center; }
  .speed { display: flex; align-items: center; gap: 8px; font-size: 9px; letter-spacing: 0.2em; color: var(--dim); }
  .speed output { width: 86px; font-size: 10.5px; letter-spacing: 0.04em; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: clamp(70px, 13vw, 150px); height: 22px; margin: 0; background: transparent; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track { height: 2px; border-radius: 1px; background: linear-gradient(90deg, var(--amber) var(--fill, 50%), rgba(170, 180, 255, 0.28) var(--fill, 50%)); }
  input[type=range]::-moz-range-track { height: 2px; background: rgba(170, 180, 255, 0.28); }
  input[type=range]::-moz-range-progress { height: 2px; background: var(--amber); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; margin-top: -5px; border-radius: 50%; background: #fff; box-shadow: 0 0 10px rgba(255, 207, 122, 0.9); }
  input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 0 10px rgba(255, 207, 122, 0.9); }
  #cap { position: absolute; left: 50%; bottom: 70px; transform: translateX(-50%); width: min(560px, calc(100% - 24px)); padding: 10px 16px 11px; border-radius: 12px; text-align: center; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; }
  #cap.on { opacity: 1; }
  #cap b { display: block; font-size: 8.5px; letter-spacing: 0.24em; color: var(--amber); font-weight: 500; }
  #cap span { display: block; margin-top: 4px; font-size: 13px; line-height: 1.4; color: var(--ink); height: 36px; overflow: hidden; }
  #cap i { display: block; height: 2px; margin-top: 7px; border-radius: 1px; background: rgba(170, 180, 255, 0.2); overflow: hidden; }
  #cap i u { display: block; height: 100%; background: var(--amber); transform-origin: left center; transform: scaleX(var(--p, 0)); }
  #hint { position: absolute; left: 172px; bottom: 70px; font-size: 10.5px; color: var(--dim); letter-spacing: 0.04em; pointer-events: none; transition: opacity 0.6s ease; }
  #hint.off { opacity: 0; }
  #flatnote { position: absolute; left: 172px; top: 64px; font-size: 10.5px; color: var(--dim); display: none; }
  @media (max-width: 860px) {
    .brand { left: 12px; top: 10px; } .brand b { font-size: 12px; } .brand span { display: none; }
    .when { top: 8px; left: auto; right: 12px; width: 170px; text-align: right; } .when b { font-size: 12px; } .when span { margin-top: 3px; }
    #bodies { left: 6px; right: 6px; top: 38px; width: auto; flex-direction: row; flex-wrap: wrap; padding: 4px; gap: 2px; border-radius: 10px; }
    #bodies > button { height: 22px; padding: 0 6px; gap: 5px; font-size: 10.5px; }
    #bodies > button i { width: 6px; height: 6px; }
    #bodies .sys { margin: 0; } #bodies .sys span { display: none; }
    #bodies { height: 32px; overflow: hidden; flex-wrap: nowrap; }
    #moons { left: 6px; right: 6px; top: 72px; width: auto; height: 24px; padding: 1px 4px; flex-direction: row; gap: 2px; overflow: hidden; background: none; border: 0; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
    #moons em { display: none; }
    #moons button { height: 22px; padding: 0 6px; gap: 5px; font-size: 10.5px; }
    #info { left: 6px; right: 6px; top: auto; bottom: 62px; width: auto; height: 228px; padding: 10px 12px 8px; }
    #info h1 { font-size: 18px; height: 23px; margin-top: 2px; display: inline-block; }
    #info .kind { position: absolute; right: 12px; top: 16px; width: 160px; text-align: right; }
    #info .tag { margin-top: 0; }
    #stats { margin-top: 6px; grid-template-columns: 1fr 1fr; column-gap: 14px; }
    #stats div { height: 21px; font-size: 10.5px; grid-template-columns: 78px minmax(0, 1fr); }
    #about { margin-top: 5px; font-size: 11px; line-height: 1.4; flex: none; height: 46px; }
    .note, #cmp { display: none; }
    .bar { bottom: 8px; gap: 5px; padding: 0 6px; height: 44px; }
    .speed > span { display: none; } .speed output { width: 70px; font-size: 10px; }
    .pill { padding: 0 9px; letter-spacing: 0.1em; } #play { width: 34px; padding: 0; } #play span, #today span { display: none; }
    #today { width: 34px; padding: 0; justify-content: center; }
    #tour { width: 68px; padding: 0; }
    #cap { bottom: 296px; } #cap span { font-size: 12px; }
    #hint, #flatnote { display: none; }
  }
  @media (max-width: 860px) and (max-height: 700px) { #info { height: 172px; } #about { display: none; } #cap { bottom: 240px; } }
  @media (max-width: 480px) { #bodies > button { padding: 0 4px; font-size: 9.5px; gap: 0; } #bodies > button i { display: none; } #moons button { padding: 0 4px; font-size: 9.5px; gap: 3px; } .speed output { width: 62px; } input[type=range] { width: 64px; } .pill { padding: 0 7px; } #sizes span b { display: none; } }
  @media (min-width: 861px) and (max-height: 560px) { #about { display: none; } #stats div { height: 21px; } }
</style>
</head>
<body>
<canvas id="gl" tabindex="0" aria-label="A 3D model of the solar system. Drag to look around, scroll to zoom, click a planet to visit it."></canvas>
<canvas id="flat"></canvas>
<div id="labels"></div>
<div class="brand"><b>ORRERY</b><span>The solar system, to explore</span></div>
<div class="when"><b id="date">&nbsp;</b><span id="clock">&nbsp;</span></div>
<nav id="bodies" class="glass" aria-label="Bodies"></nav>
<nav id="moons" class="glass off" aria-label="Moons"></nav>
<aside id="info" class="glass" aria-live="polite">
  <div class="head"><div class="kind" id="iKind">&nbsp;</div><h1 id="iName">&nbsp;</h1></div>
  <p class="tag" id="iTag">&nbsp;</p>
  <dl id="stats"><div hidden><dt>.</dt><dd></dd></div><div hidden><dt>.</dt><dd></dd></div><div hidden><dt>.</dt><dd></dd></div><div hidden><dt>.</dt><dd></dd></div><div hidden><dt>.</dt><dd></dd></div><div hidden><dt>.</dt><dd></dd></div><div hidden><dt>.</dt><dd></dd></div><div hidden><dt>.</dt><dd></dd></div><div hidden><dt>.</dt><dd></dd></div></dl>
  <p id="about"></p>
  <svg id="cmp" viewBox="0 0 260 52" aria-hidden="true"><circle id="cmpA" cy="26" r="1"/><circle id="cmpB" cy="26" r="1"/><text id="cmpTA" y="30"></text><text id="cmpTB" y="30"></text></svg>
  <div class="note"><span id="scaleNote"></span></div>
</aside>
<div id="hint">Drag to look around · scroll to zoom · click a planet</div>
<div id="flatnote">3D graphics are not available here, so this is a flat view.</div>
<div id="cap" class="glass"><b id="capN">TOUR</b><span id="capT"></span><i><u id="capP"></u></i></div>
<div class="bar glass">
  <button class="pill" id="play" type="button" aria-label="Pause"><svg viewBox="0 0 10 10" aria-hidden="true"><path id="playIcon" fill="currentColor" d="M1 0h3v10H1zM6 0h3v10H6z"/></svg><span id="playText">Pause</span></button>
  <label class="speed"><span>SPEED</span><input id="speed" type="range" min="0" max="100" value="72" aria-label="Speed of time"><output id="speedOut"></output></label>
  <button class="pill" id="today" type="button" aria-label="Back to today"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><circle cx="5" cy="5" r="4"/><path d="M5 2.6V5l1.7 1.2"/></svg><span>Today</span></button>
  <button class="pill" id="tour" type="button" aria-pressed="false"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M1 8.5c2.500-6 5.500-6 8-7M6.300 1.200L9 1.500 8.200 4"/></svg><span>Tour</span></button>
  <button class="pill" id="sizes" type="button" aria-pressed="false" aria-label="True relative sizes"><svg viewBox="0 0 10 10" fill="currentColor" aria-hidden="true"><circle cx="3.300" cy="5" r="3.300"/><circle cx="8.600" cy="5" r="1.100"/></svg><span>True<b> sizes</b></span></button>

<script>
(function () {
  'use strict';
  function $(id) { return document.getElementById(id); }
  var TEX = {}; try { TEX = JSON.parse($('tex').textContent); } catch (e) { TEX = {}; }
  var TAU = Math.PI * 2, RAD = Math.PI / 180, DAY = 86400000, J2000 = Date.UTC(2000, 0, 1, 12), FOV = 38 * RAD, TF = Math.tan(FOV / 2);
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var MONTHS = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];

  /* ---------- data ---------- */
  function P(id, name, o) { o.id = id; o.name = name; return o; }
  var SUN = P('sun', 'Sun', { kind: 'star', diam: 1391400, cr: 9, rotD: 25.4, tilt: 7.25, color: '#ffd27a', tag: 'The star at the centre',
    rows: [['Diameter', '1,391,400 km'], ['Mass', '333,000 Earths'], ['Rotation', 'about 25 days at the equator'], ['Surface', 'about 5,500 °C'], ['Core', 'about 15 million °C'], ['Gravity', '274 m/s²'], ['Age', 'about 4.5 billion years'], ['Type', 'G-type main sequence']],
    text: 'The Sun holds 99.8% of the mass of the whole solar system. Its light takes a little over eight minutes to reach Earth.', line: 'The Sun: 99.8% of everything in the solar system, by mass.' });
  var PLANETS = [
    P('mercury', 'Mercury', { au: 0.387, days: 87.969, L0: 252.25, diam: 4879, cr: 0.26, rotD: 58.646, tilt: 0.03, color: '#b9b2a8', tex: 'gen:mercury', tag: 'The smallest planet, closest to the Sun',
      rows: [['Diameter', '4,879 km'], ['Mass', '0.055 Earths'], ['Day', '58.6 Earth days to turn once'], ['Year', '88 days'], ['From the Sun', '0.39 AU'], ['Axial tilt', '0.03°'], ['Surface', '-180 to 430 °C'], ['Gravity', '3.7 m/s²'], ['Moons', 'none']],
      text: 'Mercury turns three times for every two trips round the Sun. With almost no air to hold heat, its surface swings by about 600 degrees between night and day.', line: 'Mercury races round the Sun in 88 days, baked on one side and frozen on the other.' }),
    P('venus', 'Venus', { au: 0.723, days: 224.701, L0: 181.98, diam: 12104, cr: 0.39, rotD: -243.02, tilt: 2.64, color: '#e8b56a', tex: 'venus', atm: [1.0, 0.78, 0.45, 0.55], tag: 'Earth-sized, under crushing cloud',
      rows: [['Diameter', '12,104 km'], ['Mass', '0.815 Earths'], ['Day', '243 Earth days, backwards'], ['Year', '225 days'], ['From the Sun', '0.72 AU'], ['Axial tilt', '177.4°'], ['Surface', 'about 464 °C'], ['Gravity', '8.87 m/s²'], ['Moons', 'none']],
      text: 'Venus spins backwards, and so slowly that its day is longer than its year. The map shows the surface as radar sees it through the permanent cloud; the hottest ground of any planet.', line: 'Venus: nearly Earth\'s twin in size, hot enough at the surface to melt lead.' }),
    P('earth', 'Earth', { au: 1, days: 365.256, L0: 100.46, diam: 12742, cr: 0.4, rotD: 0.99727, tilt: 23.44, color: '#5aa2ff', tex: 'earth', atm: [0.35, 0.6, 1.0, 0.9], clouds: 0.85, spec: 1, tag: 'The only world known to have life',
      rows: [['Diameter', '12,742 km'], ['Mass', '5.97 × 10²⁴ kg'], ['Day', '23 h 56 min'], ['Year', '365.26 days'], ['From the Sun', '1 AU, 149.6 million km'], ['Axial tilt', '23.44°'], ['Surface', '15 °C on average'], ['Gravity', '9.82 m/s²'], ['Moons', '1']],
      text: 'Liquid water covers 71% of the surface. The tilt of the axis, not the distance from the Sun, makes the seasons.', line: 'Earth: 71% ocean, one large moon, and the only life we know of.',
      moons: [P('moon', 'Moon', { diam: 3475, a: 384400, period: 27.322, tex: 'moon', color: '#c9c9cf', ecl: 1, tag: 'Earth\'s only natural satellite',
        rows: [['Diameter', '3,475 km'], ['Orbits', 'Earth'], ['Period', '27.3 days'], ['Distance', '384,400 km'], ['Gravity', '1.62 m/s²']],
        text: 'The Moon always keeps the same face toward Earth. Twelve people walked on it between 1969 and 1972.', line: 'The Moon always keeps the same face toward Earth.' })] }),
    P('mars', 'Mars', { au: 1.524, days: 686.98, L0: 355.45, diam: 6779, cr: 0.3, rotD: 1.02596, tilt: 25.19, color: '#e0714a', tex: 'mars', atm: [1.0, 0.6, 0.4, 0.3], tag: 'The cold red desert',
      rows: [['Diameter', '6,779 km'], ['Mass', '0.107 Earths'], ['Day', '24 h 37 min'], ['Year', '687 days'], ['From the Sun', '1.52 AU'], ['Axial tilt', '25.19°'], ['Surface', '-65 °C on average'], ['Gravity', '3.73 m/s²'], ['Moons', '2']],
      text: 'Mars is home to the largest volcano in the solar system, Olympus Mons, and to Valles Marineris, a canyon system long enough to cross the United States. Its red colour is rust: iron oxide in the rocks.', line: 'Mars: rust-red rock, and the largest volcano in the solar system.',
      moons: [P('phobos', 'Phobos', { diam: 22.5, a: 9378, period: 0.3189, tex: 'phobos', tint: [0.66, 0.58, 0.52], squash: [1, 0.8, 0.86], color: '#9c8d80', tag: 'A small, close, doomed moon',
        rows: [['Size', 'about 27 × 22 × 18 km'], ['Orbits', 'Mars'], ['Period', '7 h 39 min'], ['Distance', '9,378 km']],
        text: 'Phobos orbits Mars three times a day, faster than Mars turns. It is slowly moving toward the planet and will crash into it or break apart in about 50 million years.', line: 'Phobos circles Mars three times a day.' }),
      P('deimos', 'Deimos', { diam: 12.4, a: 23459, period: 1.263, tex: 'deimos', tint: [0.74, 0.67, 0.6], squash: [1, 0.78, 0.84], color: '#a99b8c', tag: 'The smaller, outer moon of Mars',
        rows: [['Size', 'about 15 × 12 × 11 km'], ['Orbits', 'Mars'], ['Period', '30.3 hours'], ['Distance', '23,459 km']],
        text: 'Deimos is the smaller of the two moons of Mars. A thick layer of loose debris partly fills its craters and makes it look smooth.', line: 'Deimos: a small, smooth-looking rock about 12 km across.' })] }),
    P('jupiter', 'Jupiter', { au: 5.203, days: 4332.59, L0: 34.4, diam: 139820, cr: 1.2, rotD: 0.41354, tilt: 3.13, color: '#d9b38a', tex: 'jupiter', atm: [1.0, 0.85, 0.65, 0.3], tag: 'The largest planet',
      rows: [['Diameter', '139,820 km'], ['Mass', '318 Earths'], ['Day', '9 h 56 min'], ['Year', '11.86 years'], ['From the Sun', '5.20 AU'], ['Axial tilt', '3.13°'], ['Cloud tops', 'about -110 °C'], ['Gravity', '25.9 m/s²'], ['Moons', '115']],
      text: 'Jupiter has more than twice the mass of all the other planets together. The Great Red Spot is a storm wider than Earth that has been watched for well over a century.', line: 'Jupiter: more massive than all the other planets put together.',
      moons: [P('io', 'Io', { diam: 3643, a: 421800, period: 1.769, tex: 'io', color: '#e6d36a', tag: 'The most volcanic world known',
        rows: [['Diameter', '3,643 km'], ['Orbits', 'Jupiter'], ['Period', '1.77 days'], ['Distance', '421,800 km']],
        text: 'Io is the most volcanically active world in the solar system, with hundreds of volcanoes. It is caught in a tug-of-war between Jupiter\'s gravity and the pulls of Europa and Ganymede.', line: 'Io: hundreds of volcanoes, the most volcanically active world known.' }),

    var lo = focus ? baseR(focus) * 1.35 : 24, hi = focus ? Math.max(frameDist(focus) * 6, baseR(focus) * 40) : fitSystem().dist * 2.2;
    cam.dist = clamp(cam.dist * f, lo, hi); dirty = true; kick();
  }
  glc.addEventListener('pointerdown', function (e) {
    glc.setPointerCapture(e.pointerId); ptrs[e.pointerId] = { x: e.clientX, y: e.clientY }; nPtr++;
    if (nPtr === 1) drag = { x: e.clientX, y: e.clientY, moved: 0 }; else { drag = null; pinch = 0; }
    glc.classList.add('drag'); cam.vy = cam.vp = 0;
  });
  glc.addEventListener('pointermove', function (e) {
    var p = ptrs[e.pointerId];
    if (!p) { setHover(pick(e.clientX, e.clientY)); return; }
    var dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
    if (nPtr === 1 && drag) {
      drag.moved += Math.abs(dx) + Math.abs(dy);
      if (drag.moved > 5) { userAct(); cam.vy = -dx * 0.0052; cam.vp = dy * 0.0052; cam.yaw += cam.vy; cam.pitch = clamp(cam.pitch + cam.vp, -1.45, 1.45); dirty = true; kick(); }
    } else if (nPtr === 2) {
      var ids = Object.keys(ptrs), a = ptrs[ids[0]], b = ptrs[ids[1]], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinch > 0 && d > 0) { userAct(); zoomBy(pinch / d); } pinch = d;
    }
  });
  function up(e) {
    if (!ptrs[e.pointerId]) return;
    delete ptrs[e.pointerId]; nPtr--; if (nPtr <= 0) { nPtr = 0; glc.classList.remove('drag'); }
    if (drag && drag.moved <= 5 && e.type === 'pointerup') { var b = pick(e.clientX, e.clientY); if (b) { userAct(); goTo(b); } }
    if (reduce) cam.vy = cam.vp = 0;
    drag = null; pinch = 0; kick();
  }
  glc.addEventListener('pointerup', up); glc.addEventListener('pointercancel', up);
  glc.addEventListener('pointerleave', function () { if (!nPtr) setHover(null); });
  glc.addEventListener('wheel', function (e) { e.preventDefault(); userAct(); zoomBy(Math.exp(clamp(e.deltaY, -120, 120) * (e.ctrlKey ? 0.012 : 0.0024))); }, { passive: false });
  glc.addEventListener('dblclick', function (e) { if (!pick(e.clientX, e.clientY)) { userAct(); goTo(null); } });

  /* ---------- layout and loop ---------- */
  function layout() {
    var cw = window.innerWidth || document.documentElement.clientWidth, ch = window.innerHeight || document.documentElement.clientHeight;
    if (cw < 2 || ch < 2) return false;
    CW = cw; CH = ch; PR = Math.min(window.devicePixelRatio || 1, 2) * quality;
    var target = flat ? flatC : glc; target.width = Math.round(cw * PR); target.height = Math.round(ch * PR);
    if (cw > 860) { free = { x: 164, y: 44, w: cw - 164 - 308, h: ch - 44 - 66 }; if (free.w < 200) free = { x: 0, y: 44, w: cw, h: ch - 110 }; }
    else { var ih = ch <= 700 ? 172 : 228; free = { x: 0, y: 98, w: cw, h: Math.max(120, ch - 98 - 62 - ih - 6) }; }
    if (!fly) { if (focus) cam.dist = clamp(cam.dist, baseR(focus) * 1.35, 1e6); else { var f = fitSystem(); cam.dist = f.dist; } }
    dirty = true; return true;
  }
  var acc = 0, accN = 0, gap = 0;
  function frame(now) {
    if (!running) return;
    requestAnimationFrame(frame);
    var raw = now - last, dt = Math.min(0.1, raw / 1000); last = now;
    if (reduce && !playing && !fly && !tour && !dirty && Math.abs(cam.vy) < 0.0002 && Math.abs(cam.vp) < 0.0002) return;
    var t0 = performance.now();
    var rdt = Math.min(0.25, raw / 1000);
    advance(reduce && !playing ? 0 : dt); tourTick(rdt); place(); updateCamera(rdt); sizeBodies(); project([cam.tx, cam.ty, cam.tz], {});
    dirty = false;
    if (flat) drawFlat(); else drawGL();
    updateLabels(); readouts();
    
    acc += performance.now() - t0; accN++;
    gap += Math.min(raw, 500);
    if (accN >= 24) { var ms = acc / accN, iv = gap / accN;  acc = 0; accN = 0; gap = 0; if (!flat && iv > 48 && quality > 0.42) { slow++; if (slow >= 2) { quality = Math.max(0.42, quality * 0.75); slow = 0; layout(); } } else slow = 0;  }
  }
  function kick() { if (running || document.hidden || !CW) return; running = true; last = performance.now(); requestAnimationFrame(frame); }
  document.addEventListener('visibilitychange', function () { if (document.hidden) running = false; else kick(); });
  var pendingResize = 0;
  window.addEventListener('resize', function () { if (pendingResize) return; pendingResize = requestAnimationFrame(function () { pendingResize = 0; if (layout()) { if (!focus && !fly) cam.pitch = fitSystem().pitch; kick(); } }); });
  function goFlat() { flat = true; glc.style.visibility = 'hidden'; flatC.style.display = 'block'; flatC.style.pointerEvents = 'none'; f2 = flatC.getContext('2d'); $('flatnote').style.display = ''; layout(); dirty = true; }
  glc.addEventListener('webglcontextlost', function (e) { e.preventDefault(); goFlat(); });

  var ok = false;
  try { ok = initGL(); } catch (err) { ok = false; }
  if (!ok) { glc.style.opacity = '0'; flat = true; flatC.style.display = 'block'; flatC.style.pointerEvents = 'none'; f2 = flatC.getContext('2d'); $('flatnote').style.display = window.innerWidth > 860 ? 'block' : ''; }
  syncSpeed(); setPlaying(playing); syncUI();
  if (layout()) {
    var f0 = fitSystem(); place();
    if (reduce) { cam.dist = f0.dist; cam.pitch = f0.pitch; }
    else { cam.dist = f0.dist * 2.4; cam.pitch = 1.1; fly = { from: { tx: 0, ty: 0, tz: 0, dist: cam.dist, eff: cam.yaw - 0.9, pitch: cam.pitch }, k: 0, dur: 3.2, dist: f0.dist, pitch: f0.pitch, yaw: cam.yaw }; }
    kick();
  }
  if (!reduce) setTimeout(function () { hint.classList.add('off'); }, 12000);
  
})();
</script>
