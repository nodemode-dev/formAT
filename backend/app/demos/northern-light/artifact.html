<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northern Light</title>
<style>
  html, body { margin: 0; height: 100%; background: #04070f; overflow: hidden; }
  body { position: fixed; inset: 0; cursor: crosshair; -webkit-user-select: none; user-select: none; }
  .layer { position: absolute; left: 0; top: 0; display: block; pointer-events: none; will-change: transform; }
  .vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 85% 80% at 50% 44%, rgba(0,0,0,0) 42%, rgba(0,0,0,0.5) 100%); }
  .caption { position: absolute; left: 0; right: 0; bottom: max(14px, 3.2vh); text-align: center; pointer-events: none;
    font: 500 clamp(9px, 1.5vmin, 12px)/1 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    letter-spacing: 0.62em; text-indent: 0.62em; color: rgba(190, 214, 226, 0.5); text-transform: uppercase; }
  .hint { position: absolute; left: 12px; right: 12px; bottom: calc(max(14px, 3.2vh) + 24px); text-align: center; pointer-events: none;
    font: 400 11px/1.3 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.06em;
    color: rgba(190, 214, 226, 0.5); opacity: 0; transition: opacity 1.2s ease; }
  .hint.on { opacity: 1; }
</style>
</head>
<body>
<canvas class="layer" id="sky" aria-label="An aurora over a mountain lake at night"></canvas>
<canvas class="layer" id="stars"></canvas>
<canvas class="layer" id="aurora"></canvas>
<canvas class="layer" id="lake"></canvas>
<canvas class="layer" id="ridge0"></canvas>
<canvas class="layer" id="ridge1"></canvas>
<canvas class="layer" id="ridge2"></canvas>
<div class="vignette"></div>
<div class="hint" id="hint">Move the pointer to draw the lights toward it · click for a shooting star</div>
<div class="caption">Northern Light</div>
<script>
(function () {
  'use strict';
  function $(id) { return document.getElementById(id); }
  var skyEl = $('sky'), starsEl = $('stars'), aurEl = $('aurora'), lakeEl = $('lake'), ridgeEls = [$('ridge0'), $('ridge1'), $('ridge2')], hint = $('hint');
  var starCtx = starsEl.getContext('2d'), aurCtx = aurEl.getContext('2d'), lakeCtx = lakeEl.getContext('2d', { alpha: false });
  var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var CW = 0, CH = 0, HZ = 0, D = 1, PAD = 0;
  var img, acc, bloom, bloomCtx, lakeBase, mirror, mirrorCtx, sprites = [], ridgePar = [5, 11, 20];
  var twinkle = [], flares = [], glints = [], shots = [];
  var pointer = { x: 0.5, y: 0.3, tx: 0.5, ty: 0.3, on: 0, ton: 0 };
  var t = 40, last = 0, lastDraw = 0, running = false, nextShot = 9, glow = 0.5;
  window.__frames = 0;

  function rng(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var x = Math.imul(a ^ (a >>> 15), 1 | a);
      x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
      return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hash(i, j) {
    var n = Math.imul(i, 374761393) + Math.imul(j, 668265263);
    n = Math.imul(n ^ (n >>> 13), 1274126177);
    return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
  }
  function noise(x, y) {
    var xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    var u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    var a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  function fbm(x, y) { return noise(x, y) * 0.6 + noise(x * 2.1 + 5.2, y * 2.1 + 1.3) * 0.28 + noise(x * 4.3 + 9.1, y * 4.3 + 7.7) * 0.12; }
  function smooth(a, b, x) { x = Math.max(0, Math.min(1, (x - a) / (b - a))); return x * x * (3 - 2 * x); }
  function make(w, h) { var c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; }
  function size(el, w, h, cssW, cssH) { el.width = Math.max(1, Math.round(w)); el.height = Math.max(1, Math.round(h)); el.style.width = cssW + 'px'; el.style.height = cssH + 'px'; }

  var CURTAINS = [
    { base: 0.52, amp: 0.085, tall: 0.56, gain: 1.4, dir: 1, seed: 3.1, stops: [[0, '150,255,200'], [0.18, '70,240,160'], [0.5, '40,195,170'], [0.8, '60,115,205'], [1, '95,75,195']] },
    { base: 0.38, amp: 0.070, tall: 0.48, gain: 1.2, dir: -1, seed: 17.4, stops: [[0, '130,250,220'], [0.25, '50,220,190'], [0.6, '45,155,205'], [1, '85,85,205']] },
    { base: 0.64, amp: 0.060, tall: 0.40, gain: 0.95, dir: 1, seed: 41.9, stops: [[0, '180,255,175'], [0.3, '110,235,130'], [0.7, '60,175,150'], [1, '60,105,175']] },
    { base: 0.28, amp: 0.050, tall: 0.38, gain: 0.8, dir: -1, seed: 77.2, stops: [[0, '205,155,255'], [0.3, '165,105,240'], [0.7, '115,85,215'], [1, '70,60,175']] }
  ];

  function buildSprites() {
    sprites = CURTAINS.map(function (c) {
      var lut = new Float32Array(256 * 3);
      for (var i = 0; i < 256; i++) {
        var p = i / 255;
        var a = p < 0.06 ? smooth(0, 0.06, p) : Math.pow(1 - (p - 0.06) / 0.94, 1.9);
        var k = 0;
        while (k < c.stops.length - 2 && p > c.stops[k + 1][0]) k++;
        var s0 = c.stops[k], s1 = c.stops[k + 1], f = Math.max(0, Math.min(1, (p - s0[0]) / (s1[0] - s0[0])));
        var c0 = s0[1].split(','), c1 = s1[1].split(',');
        for (var j = 0; j < 3; j++) lut[i * 3 + j] = (+c0[j] + (+c1[j] - +c0[j]) * f) * a;
      }
      return lut;
    });
  }

  function buildSky() {
    var w = (CW + PAD * 2) * D, h = HZ * D;
    size(skyEl, w, h, CW + PAD * 2, HZ);
    skyEl.style.left = -PAD + 'px';
    var g = skyEl.getContext('2d', { alpha: false });
    var grad = g.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#03050d'); grad.addColorStop(0.35, '#07102a'); grad.addColorStop(0.7, '#0b2540'); grad.addColorStop(1, '#0f3d4a');
    g.fillStyle = grad; g.fillRect(0, 0, w, h);
    var r = rng(11), i;
    g.save();
    g.translate(w * 0.62, h * 0.3); g.rotate(-0.5);
    var band = g.createLinearGradient(0, -h * 0.16, 0, h * 0.16);
    band.addColorStop(0, 'rgba(120,140,200,0)'); band.addColorStop(0.5, 'rgba(120,140,200,0.075)'); band.addColorStop(1, 'rgba(120,140,200,0)');
    g.fillStyle = band; g.fillRect(-w, -h * 0.16, w * 2, h * 0.32);
    var dust = Math.round(CW * HZ / 380);
    for (i = 0; i < dust; i++) {
      var x = (r() - 0.5) * w * 1.6, y = (r() + r() + r() - 1.5) * h * 0.085;
      g.fillStyle = 'rgba(200,215,255,' + (0.05 + r() * 0.24).toFixed(3) + ')';
      g.fillRect(x, y, D * (r() < 0.9 ? 0.7 : 1.2), D * 0.7);
    }
    g.restore();
    var tints = ['255,255,255', '190,215,255', '255,232,205'];
    var count = Math.round(CW * HZ / 1100);
    for (i = 0; i < count; i++) {
      var sx = r() * w, sy = Math.pow(r(), 1.25) * h * 0.97, m = r();
      g.fillStyle = 'rgba(' + tints[(r() * 3) | 0] + ',' + (0.25 + r() * 0.6).toFixed(3) + ')';
      g.beginPath(); g.arc(sx, sy, D * (0.35 + m * m * 0.85), 0, 6.2832); g.fill();
    }
    twinkle = [];
    for (i = 0; i < 70; i++) twinkle.push({ x: r(), y: Math.pow(r(), 1.2) * 0.92, r: 0.6 + r() * 0.8, p: r() * 6.28, s: 0.6 + r() * 1.8, c: tints[(r() * 3) | 0] });
    flares = [];
    for (i = 0; i < 26; i++) flares.push({ x: r(), y: Math.pow(r(), 1.1) * 0.85, r: 1.0 + r() * 1.0, p: r() * 6.28, s: 0.3 + r() * 0.9, c: tints[(r() * 3) | 0] });
    glints = [];
    for (i = 0; i < 46; i++) glints.push({ x: r(), y: r(), p: r() * 6.28, s: 0.5 + r() * 1.4, w: 0.6 + r() * 1.6 });
  }

  function ridgeLine(seed, x, rough) {
    return noise(x * rough + seed, seed * 1.7) * 0.62 + noise(x * rough * 2.7 + seed * 3, 4.2) * 0.26 + noise(x * rough * 7.1 + seed, 9.9) * 0.12;
  }
  function pine(g, x, y, h) {
    var w = h * 0.34, i, yy, ww;
    g.beginPath(); g.moveTo(x, y - h);
    for (i = 1; i <= 4; i++) { yy = y - h + (h * 0.94) * i / 4; ww = w * (0.28 + 0.72 * i / 4); g.lineTo(x + ww, yy); g.lineTo(x + ww * 0.45, yy - h * 0.035); }
    g.lineTo(x + w * 0.1, y - h * 0.06); g.lineTo(x + w * 0.1, y + 2); g.lineTo(x - w * 0.1, y + 2); g.lineTo(x - w * 0.1, y - h * 0.06);
    for (i = 4; i >= 1; i--) { yy = y - h + (h * 0.94) * i / 4; ww = w * (0.28 + 0.72 * i / 4); g.lineTo(x - ww * 0.45, yy - h * 0.035); g.lineTo(x - ww, yy); }
    g.closePath(); g.fill();
  }
  function buildRidges() {
    var specs = [
      { seed: 5.3, top: 0.205, rough: 1.3, fill: ['#17324c', '#12293f'], trees: 0 },
      { seed: 12.8, top: 0.14, rough: 1.9, fill: ['#0d2034', '#0a1a2a'], trees: 0 },
      { seed: 23.1, top: 0.08, rough: 2.6, fill: ['#050b14', '#04080f'], trees: 1 }
    ];
    specs.forEach(function (sp, k) {
      var el = ridgeEls[k], cssW = CW + PAD * 2, cssH = Math.round(CH * 0.3), w = cssW * D, hh = cssH * D;
      size(el, w, hh, cssW, cssH);
      el.style.left = -PAD + 'px'; el.style.top = (HZ - cssH + 1) + 'px';
      var g = el.getContext('2d');
      var grad = g.createLinearGradient(0, hh * 0.3, 0, hh);
      grad.addColorStop(0, sp.fill[0]); grad.addColorStop(1, sp.fill[1]);
      g.fillStyle = grad;
      var ys = [], step = 3 * D;
      g.beginPath(); g.moveTo(0, hh);
      for (var x = 0; x <= w + step; x += step) {
        var u = (x / D - PAD) / CW, edge = sp.trees ? 0.45 + 0.55 * Math.pow(Math.min(1.2, Math.abs(u - 0.5) * 2), 1.6) : 1;
        var y = hh - CH * D * sp.top * (0.35 + ridgeLine(sp.seed, u, sp.rough) * 1.05) * edge - D * 2;
        ys.push(y); g.lineTo(x, y);
      }
      g.lineTo(w, hh); g.closePath(); g.fill();
      if (sp.trees) {
        var r = rng(91), n = Math.round(cssW / 6.5), scale = Math.min(1.7, Math.max(0.75, CH / 640));
        g.fillStyle = '#03070d';
        for (var i = 0; i < n; i++) {
          var tx = r() * w, uu = (tx / D - PAD) / CW, side = Math.pow(Math.min(1, Math.abs(uu - 0.5) * 2), 1.4);
          if (r() > 0.16 + side * 0.95) continue;
          var gy = ys[Math.min(ys.length - 1, Math.round(tx / step))];
          pine(g, tx, gy + D * 1.5, D * (9 + r() * 15) * (0.55 + side * 1.25) * scale);
        }
      }
    });
  }

  function buildLake() {
    var lakeH = CH - HZ, lw = Math.max(200, Math.min(720, Math.round(CW / 1.6))), lh = Math.max(40, Math.round(lw * lakeH / CW));
    size(lakeEl, lw, lh, CW, lakeH);
    lakeEl.style.top = HZ + 'px';
    lakeBase = make(lw, lh); mirror = make(lw, lh); mirrorCtx = mirror.getContext('2d', { alpha: false });
    var g = lakeBase.getContext('2d', { alpha: false }), span = Math.min(HZ, lakeH * 1.18);
    g.save(); g.translate(0, lh); g.scale(1, -1);
    g.drawImage(skyEl, PAD * D, (HZ - span) * D, CW * D, span * D, 0, 0, lw, lh);
    ridgeEls.forEach(function (el) {
      var cssH = el.height / D, top = HZ - cssH + 1, from = Math.max(top, HZ - span);
      g.drawImage(el, PAD * D, (from - top) * D, CW * D, (HZ - from) * D, 0, (from - (HZ - span)) / span * lh, lw, (HZ - from) / span * lh);
    });
    g.restore();
    var lg = g.createLinearGradient(0, 0, 0, lh);
    lg.addColorStop(0, 'rgba(4,10,18,0.3)'); lg.addColorStop(0.5, 'rgba(4,9,17,0.58)'); lg.addColorStop(1, 'rgba(3,6,12,0.86)');
    g.fillStyle = lg; g.fillRect(0, 0, lw, lh);
  }

  function resize() {
    var cw = window.innerWidth || document.documentElement.clientWidth, ch = window.innerHeight || document.documentElement.clientHeight;
    if (cw < 2 || ch < 2) return false;
    CW = cw; CH = ch; HZ = Math.round(ch * 0.665); PAD = Math.ceil(cw * 0.03) + 8;
    D = Math.min(window.devicePixelRatio || 1, 2);
    if (cw * ch * D * D > 5000000) D = Math.sqrt(5000000 / (cw * ch));
    size(starsEl, CW * D, HZ * D, CW, HZ);
    var aw = Math.max(140, Math.min(420, Math.round(cw / 2.6))), ah = Math.max(60, Math.round(aw * HZ / cw));
    size(aurEl, aw, ah, CW, HZ);
    bloom = make(Math.round(aw / 6), Math.round(ah / 6)); bloomCtx = bloom.getContext('2d');
    img = aurCtx.createImageData(aurEl.width, aurEl.height); acc = new Float32Array(aurEl.width * aurEl.height * 3);
    buildSky(); buildRidges(); buildLake();
    return true;
  }

  function drawAurora() {
    var aw = aurEl.width, ah = aurEl.height, g = aurCtx, x, y, k, o;
    acc.fill(0);
    var sum = 0, px = pointer.x, pull = pointer.on;
    var breath = 0.84 + 0.16 * Math.sin(t * 0.11) + 0.1 * Math.sin(t * 0.043 + 2);
    for (k = 0; k < CURTAINS.length; k++) {
      var c = CURTAINS[k], lut = sprites[k];
      for (x = 0; x < aw; x++) {
        var u = x / aw, near = Math.exp(-((u - px) * (u - px)) / 0.03) * pull;
        var env = smooth(0.22, 0.62, noise(u * 1.5 + c.seed - t * 0.018 * c.dir, t * 0.045 + c.seed) + near * 0.32);
        if (env < 0.01) continue;
        var ray = (0.5 + 0.5 * noise(u * 95 + c.seed * 3 + t * 0.22 * c.dir, t * 0.35)) * (0.6 + 0.4 * noise(u * 17 - t * 0.09 * c.dir, c.seed + t * 0.12));
        var a = env * (0.22 + 0.78 * ray) * c.gain * breath * (1 + near * 0.6);
        if (a < 0.012) continue;
        var fold = fbm(u * 2.3 + c.seed * 2 + t * 0.012 * c.dir, t * 0.028 + c.seed);
        var edge = (c.base + c.amp * (fold - 0.5) * 2.4 + 0.022 * Math.sin(u * 9 + t * 0.21 + k * 1.7) + near * 0.035 * (pointer.y - 0.3)) * ah;
        var tall = ah * c.tall * (0.55 + 0.6 * noise(u * 3.1 + c.seed, t * 0.05)) * (0.72 + 0.28 * ray);
        var y0 = Math.max(0, Math.ceil(edge - tall)), y1 = Math.min(ah - 1, Math.floor(edge)), inv = 255 / tall;
        for (y = y0; y <= y1; y++) {
          var li = ((edge - y) * inv | 0) * 3;
          o = (y * aw + x) * 3;
          acc[o] += lut[li] * a; acc[o + 1] += lut[li + 1] * a; acc[o + 2] += lut[li + 2] * a;
        }
        sum += a;
      }
    }
    glow += (Math.min(1, sum / (aw * 1.3)) - glow) * 0.15;
    var d = img.data, n = aw * ah;
    for (var i = 0; i < n; i++) {
      o = i * 3;
      var r = acc[o], gg = acc[o + 1], bb = acc[o + 2], m = r > gg ? (r > bb ? r : bb) : (gg > bb ? gg : bb), q = i * 4;
      if (m < 1) { d[q + 3] = 0; continue; }
      var al = m > 255 ? 255 : m, sc = 255 / m;
      d[q] = r * sc; d[q + 1] = gg * sc; d[q + 2] = bb * sc; d[q + 3] = al;
    }
    g.putImageData(img, 0, 0);
    bloomCtx.globalCompositeOperation = 'copy';
    bloomCtx.drawImage(aurEl, 0, 0, bloom.width, bloom.height);
    g.globalCompositeOperation = 'lighter';
    g.globalAlpha = 0.5;
    g.drawImage(bloom, -aw * 0.03, -ah * 0.03, aw * 1.06, ah * 1.1);
    g.globalAlpha = 1;
    var hg = g.createLinearGradient(0, ah * 0.6, 0, ah);
    hg.addColorStop(0, 'rgba(60,200,170,0)'); hg.addColorStop(1, 'rgba(60,200,170,' + (0.05 + glow * 0.22).toFixed(3) + ')');
    g.fillStyle = hg; g.fillRect(0, ah * 0.6, aw, ah * 0.4);
  }

  function drawStars() {
    var g = starCtx, w = starsEl.width, h = starsEl.height, i, s, a;
    g.clearRect(0, 0, w, h);
    for (i = 0; i < twinkle.length; i++) {
      s = twinkle[i]; a = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * s.s + s.p));
      g.fillStyle = 'rgba(' + s.c + ',' + (a * 0.9).toFixed(3) + ')';
      g.beginPath(); g.arc(s.x * w, s.y * h, s.r * D, 0, 6.2832); g.fill();
    }
    g.lineWidth = Math.max(1, D * 0.8);
    for (i = 0; i < flares.length; i++) {
      s = flares[i]; a = 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(t * s.s + s.p));
      var fx = s.x * w, fy = s.y * h, fl = D * s.r * (3.2 + 2.4 * a);
      g.strokeStyle = 'rgba(' + s.c + ',' + (a * 0.4).toFixed(3) + ')';
      g.beginPath(); g.moveTo(fx - fl, fy); g.lineTo(fx + fl, fy); g.moveTo(fx, fy - fl); g.lineTo(fx, fy + fl); g.stroke();
      g.fillStyle = 'rgba(' + s.c + ',' + (0.6 + a * 0.4).toFixed(3) + ')';
      g.beginPath(); g.arc(fx, fy, s.r * D, 0, 6.2832); g.fill();
    }
    for (i = 0; i < shots.length; i++) {
      s = shots[i];
      var p = s.life / s.dur; if (p >= 1) continue;
      var x = (s.x + s.vx * p) * w, y = (s.y + s.vy * p) * h, len = w * 0.11 * Math.sin(p * 3.1416);
      var ang = Math.atan2(s.vy * h, s.vx * w), dx = Math.cos(ang) * len, dy = Math.sin(ang) * len;
      var gr = g.createLinearGradient(x, y, x - dx, y - dy);
      gr.addColorStop(0, 'rgba(255,255,255,' + (0.95 * Math.sin(p * 3.1416)).toFixed(3) + ')'); gr.addColorStop(1, 'rgba(180,220,255,0)');
      g.strokeStyle = gr; g.lineWidth = D * 1.5; g.lineCap = 'round';
      g.beginPath(); g.moveTo(x, y); g.lineTo(x - dx, y - dy); g.stroke();
    }
  }

  function drawLake() {
    var lw = lakeEl.width, lh = lakeEl.height, m = mirrorCtx, g = lakeCtx, aw = aurEl.width, ah = aurEl.height;
    var span = Math.min(HZ, (CH - HZ) * 1.18) / HZ;
    m.globalCompositeOperation = 'source-over'; m.globalAlpha = 1;
    m.drawImage(lakeBase, 0, 0);
    m.globalCompositeOperation = 'lighter'; m.globalAlpha = 0.5;
    m.save(); m.translate(0, lh); m.scale(1, -1);
    m.drawImage(aurEl, 0, ah * (1 - span), aw, ah * span, 0, 0, lw, lh);
    m.restore();
    var strip = 3, n = Math.ceil(lh / strip), k = lw / CW;
    g.drawImage(mirror, 0, 0);
    for (var i = 1; i < n; i++) {
      var d = i / n;
      var off = (Math.sin(d * 34 - t * 1.25) * (0.6 + d * 5.5) + Math.sin(d * 11 + t * 0.6) * d * 4) * k;
      g.drawImage(mirror, 0, i * strip, lw, strip, off, i * strip, lw, strip);
    }
    g.fillStyle = 'rgba(150,235,210,' + (0.06 + glow * 0.12).toFixed(3) + ')';
    g.fillRect(0, 0, lw, 1);
    for (i = 0; i < glints.length; i++) {
      var s = glints[i], a = Math.max(0, Math.sin(t * s.s + s.p));
      if (a < 0.2) continue;
      var gy = (0.05 + s.y * s.y * 0.9) * lh, gw = (6 + 26 * s.y) * s.w * k, gx = ((s.x + t * 0.004 * (0.3 + s.y)) % 1) * lw;
      g.fillStyle = 'rgba(170,240,215,' + (a * a * (0.06 + glow * 0.2)).toFixed(3) + ')';
      g.fillRect(gx - gw / 2, Math.round(gy), gw, 1);
    }
  }

  function parallax() {
    var px = pointer.x - 0.5, py = pointer.y - 0.5;
    skyEl.style.transform = 'translate3d(' + Math.round(-px * PAD * 0.5) + 'px,' + Math.round(-py * 3) + 'px,0)';
    starsEl.style.transform = 'translate3d(' + Math.round(-px * PAD * 0.75) + 'px,' + Math.round(-py * 4.5) + 'px,0)';
    for (var i = 0; i < 3; i++) ridgeEls[i].style.transform = 'translate3d(' + Math.round(-px * ridgePar[i] * PAD / 28) + 'px,0,0)';
  }

  function draw() {
    if (!CW) return;
    var m0 = performance.now();
    if (!running || (window.__frames & 1) === 0) drawAurora();
    drawStars(); drawLake(); parallax();
    window.__frames++; window.__ms = (window.__ms || 0) * 0.9 + (performance.now() - m0) * 0.1;
  }

  function shoot(x, y) {
    var dir = x > 0.5 ? -1 : 1;
    shots.push({ x: x, y: y, vx: dir * (0.16 + Math.random() * 0.1), vy: 0.1 + Math.random() * 0.08, life: 0, dur: 0.9 + Math.random() * 0.4 });
  }
  function frame(now) {
    if (!running) return;
    requestAnimationFrame(frame);
    if (now - lastDraw < 30) return;
    var dt = Math.min(0.1, (now - last) / 1000 || 0.033);
    last = now; lastDraw = now; t += dt;
    pointer.x += (pointer.tx - pointer.x) * 0.07; pointer.y += (pointer.ty - pointer.y) * 0.07; pointer.on += (pointer.ton - pointer.on) * 0.045;
    nextShot -= dt;
    if (nextShot <= 0) { shoot(0.15 + Math.random() * 0.7, 0.05 + Math.random() * 0.3); nextShot = 11 + Math.random() * 16; }
    for (var i = shots.length - 1; i >= 0; i--) { shots[i].life += dt; if (shots[i].life > shots[i].dur) shots.splice(i, 1); }
    draw();
  }
  function start() { if (still || running || document.hidden || !CW) return; running = true; last = lastDraw = performance.now(); requestAnimationFrame(frame); }
  function stop() { running = false; }

  function onPointer(e) {
    pointer.tx = e.clientX / (window.innerWidth || 1); pointer.ty = e.clientY / (window.innerHeight || 1); pointer.ton = 1;
    hint.classList.remove('on');
    if (still) { pointer.x = pointer.tx; pointer.y = pointer.ty; pointer.on = 1; draw(); }
  }
  window.addEventListener('pointermove', onPointer, { passive: true });
  window.addEventListener('pointerdown', function (e) {
    onPointer(e);
    shoot(e.clientX / (window.innerWidth || 1), Math.min(0.4, (e.clientY / (window.innerHeight || 1)) * 0.6));
    if (still) { shots[shots.length - 1].life = 0.45; draw(); shots.length = 0; }
  }, { passive: true });
  document.documentElement.addEventListener('pointerleave', function () { pointer.ton = 0; });
  document.addEventListener('visibilitychange', function () { if (document.hidden) stop(); else start(); });
  var pending = 0;
  window.addEventListener('resize', function () {
    if (pending) return;
    pending = requestAnimationFrame(function () { pending = 0; if (resize()) { draw(); start(); } });
  });

  buildSprites();
  if (resize()) { draw(); start(); }
  if (!still) { setTimeout(function () { if (!pointer.ton) hint.classList.add('on'); }, 1800); setTimeout(function () { hint.classList.remove('on'); }, 9000); }
})();
</script>
</body>
