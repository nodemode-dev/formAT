<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbour Ferries, season 2026</title>
<style>
  :root { --bg: #0a1115; --card: #111b21; --card2: #0e171c; --line: rgba(190, 225, 230, 0.09); --grid: rgba(190, 225, 230, 0.07);
    --ink: #e7eff1; --ink2: #b3c4c8; --mute: #7f969b; --teal: #22a596; --teal-hi: #5fd6c8; --amber: #c4832a; --amber-hi: #f0b45e; --good: #37c26b; --bad: #ec835a;
    --ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--ui); }
  body { overflow-x: hidden; overflow-y: auto; scrollbar-width: none; background: radial-gradient(120% 80% at 80% -10%, #12262b 0%, var(--bg) 55%); }
  body::-webkit-scrollbar { display: none; }
  .app { height: 100%; min-height: 620px; padding: 12px; display: grid; gap: 10px;
    grid-template-columns: repeat(12, minmax(0, 1fr)); grid-template-rows: auto auto minmax(0, 1.25fr) minmax(0, 1fr);
    grid-template-areas: "head head head head head head head head head head head head" "k1 k1 k1 k2 k2 k2 k3 k3 k3 k4 k4 k4" "daily daily daily daily daily daily daily daily ontime ontime ontime ontime" "routes routes routes routes board board board board board board board board"; }
  header { grid-area: head; display: flex; align-items: center; gap: 12px; min-width: 0; height: 34px; }
  .brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .brand svg { width: 22px; height: 22px; flex: none; color: var(--teal-hi); }
  .brand b { font-size: 14px; font-weight: 600; letter-spacing: 0.01em; white-space: nowrap; }
  .brand span { font-size: 12px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chips { display: flex; gap: 4px; margin-left: auto; padding: 3px; border-radius: 9px; background: rgba(255, 255, 255, 0.035); border: 1px solid var(--line); }
  .chips button { all: unset; cursor: pointer; height: 22px; padding: 0 9px; border-radius: 6px; font: 500 11px/22px var(--ui); color: var(--ink2); white-space: nowrap; transition: background 0.15s ease, color 0.15s ease; }
  .chips button:hover { background: rgba(255, 255, 255, 0.06); color: var(--ink); }
  .chips button[aria-pressed="true"] { background: rgba(34, 165, 150, 0.22); color: #fff; box-shadow: inset 0 0 0 1px rgba(95, 214, 200, 0.4); }
  .chips button:focus-visible, .bar-row:focus-visible { outline: 2px solid var(--amber-hi); outline-offset: 1px; }
  .chips .short { display: none; }
  .clock { display: flex; align-items: center; gap: 7px; height: 28px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.035); font-size: 11px; color: var(--mute); white-space: nowrap; }
  .clock i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 0 rgba(55, 194, 107, 0.5); animation: pulse 2s ease-out infinite; }
  .clock b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; width: 58px; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(55, 194, 107, 0.55); } 100% { box-shadow: 0 0 0 9px rgba(55, 194, 107, 0); } }
  .card { position: relative; min-width: 0; min-height: 0; border-radius: 12px; background: linear-gradient(180deg, var(--card) 0%, var(--card2) 100%); border: 1px solid var(--line); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03); }
  .kpi { height: 84px; padding: 11px 13px; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr auto; }
  .kpi .lab, .card h2 { margin: 0; font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi .val { align-self: center; font-size: 25px; font-weight: 600; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .kpi .sub { font-size: 11px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi .sub em { font-style: normal; font-weight: 600; color: var(--ink2); }
  .kpi .sub em.up::before, .kpi .sub em.down::before { content: ""; display: inline-block; width: 0; height: 0; margin-right: 4px; border-left: 4px solid transparent; border-right: 4px solid transparent; vertical-align: 1px; }
  .kpi .sub em.up::before { border-bottom: 6px solid var(--good); }
  .kpi .sub em.down::before { border-top: 6px solid var(--bad); }
  .kpi svg { position: absolute; right: 13px; top: 13px; width: 34%; height: 42px; overflow: visible; }
  .panel { display: flex; flex-direction: column; padding: 12px 13px 10px; }
  .panel .top { display: flex; align-items: baseline; gap: 8px; min-width: 0; height: 15px; flex: none; }
  .panel .top p { margin: 0; font-size: 11px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .plot { position: relative; flex: 1; min-height: 0; margin-top: 6px; }
  .plot svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
  svg text { font-family: var(--ui); font-size: 10px; fill: var(--mute); font-variant-numeric: tabular-nums; }
  .draw { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw 1.4s 0.15s cubic-bezier(0.3, 0.7, 0.2, 1) forwards; }
  .fade { opacity: 0; animation: fade 0.9s 0.7s ease forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes fade { to { opacity: 1; } }
  #k1 { grid-area: k1; } #k2 { grid-area: k2; } #k3 { grid-area: k3; } #k4 { grid-area: k4; }
  #daily { grid-area: daily; } #ontime { grid-area: ontime; } #routes { grid-area: routes; } #board { grid-area: board; }
  .bars { flex: 1; min-height: 0; margin-top: 8px; display: grid; grid-auto-rows: minmax(0, 1fr); gap: 2px; }
  .bar-row { display: grid; grid-template-columns: 96px minmax(0, 1fr) 96px; align-items: center; gap: 8px; padding: 0 4px; margin: 0 -4px; border-radius: 6px; cursor: pointer; font-size: 11.5px; color: var(--ink2); transition: opacity 0.18s ease, background 0.18s ease; }
  .bar-row:hover { background: rgba(255, 255, 255, 0.04); }
  .bar-row .track { height: 10px; border-radius: 0 4px 4px 0; }
  .bar-row .fill { height: 100%; width: 100%; border-radius: 0 4px 4px 0; background: var(--teal); transform-origin: left center; transform: scaleX(var(--v)); transition: transform 0.9s cubic-bezier(0.2, 0.7, 0.2, 1), background 0.18s ease; }
  .bar-row .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap; }
  .bar-row .num small { font-size: 10.5px; color: var(--mute); margin-left: 5px; }
  .bars.has-sel .bar-row:not(.sel) { opacity: 0.45; }
  .bar-row.sel .fill, .bar-row:hover .fill { background: var(--teal-hi); }
  .bar-row span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  table { width: 100%; height: 100%; border-collapse: collapse; table-layout: fixed; font-size: 11.5px; }
  .tablewrap { flex: 1; min-height: 0; margin-top: 6px; overflow: hidden; }
  th { text-align: left; font-size: 9.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--mute); padding: 0 6px 4px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 0 6px 0 0; border-bottom: 1px solid var(--grid); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink2); }
  tr:last-child td { border-bottom: 0; }
  td.r, th.r { text-align: right; padding-right: 0; }
  td b { font-weight: 600; color: var(--ink); }
  td .code { display: inline-block; width: 24px; height: 16px; margin-right: 7px; border-radius: 4px; background: rgba(34, 165, 150, 0.18); color: var(--teal-hi); font-size: 9.5px; font-weight: 700; line-height: 16px; text-align: center; letter-spacing: 0.04em; vertical-align: 1px; }
  td.num { font-variant-numeric: tabular-nums; color: var(--ink); }
  td.soon { color: var(--amber-hi); }
  .prog { display: block; height: 3px; border-radius: 2px; background: rgba(190, 225, 230, 0.1); overflow: hidden; }
  .prog i { display: block; height: 100%; background: var(--teal); transform-origin: left center; transform: scaleX(var(--p, 0)); transition: transform 1s linear; }
  col.c-route { width: 34%; } col.c-next { width: 13%; } col.c-in { width: 15%; } col.c-ves { width: 20%; } col.c-prog { width: 18%; }
  .tip { position: fixed; left: 0; top: 0; z-index: 5; min-width: 148px; padding: 8px 10px 9px; border-radius: 9px; pointer-events: none; opacity: 0; background: rgba(8, 14, 18, 0.95); border: 1px solid rgba(190, 225, 230, 0.2); box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5); font-size: 11px; color: var(--mute); transition: opacity 0.12s ease; will-change: transform; }
  .tip.on { opacity: 1; }
  .tip h3 { margin: 0 0 3px; font-size: 10.5px; font-weight: 500; color: var(--ink2); }
  .tip strong { display: block; font-size: 15px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
  .tip p { margin: 2px 0 0; white-space: nowrap; }
  .tip p.note { color: var(--amber-hi); }
  .foot { position: absolute; right: 13px; top: 12px; font-size: 10px; color: var(--mute); white-space: nowrap; }
  @media (max-width: 900px) {
    .app { min-height: 760px; padding: 10px; gap: 8px; grid-template-rows: auto auto auto auto minmax(150px, 1.3fr) minmax(128px, 0.9fr) auto;
      grid-template-areas: "head head head head head head head head head head head head" "chips chips chips chips chips chips chips chips chips chips chips chips" "k1 k1 k1 k1 k1 k1 k2 k2 k2 k2 k2 k2" "k3 k3 k3 k3 k3 k3 k4 k4 k4 k4 k4 k4" "daily daily daily daily daily daily daily daily daily daily daily daily" "routes routes routes routes routes routes ontime ontime ontime ontime ontime ontime" "board board board board board board board board board board board board"; }
    header { display: contents; }
    .brand { grid-area: head; grid-column: 1 / 9; height: 28px; }
    .clock { grid-area: head; grid-column: 9 / 13; justify-self: end; }
    .chips { grid-area: chips; margin: 0; justify-content: space-between; }
    .chips button { flex: 1; text-align: center; padding: 0 4px; }
    .kpi { height: 76px; padding: 9px 11px; }
    .kpi .val { font-size: 22px; }
    .kpi svg { right: 11px; top: 27px; height: 26px; width: 36%; }
    #ontime .top p, #routes .top p { display: none; }
    .bar-row { grid-template-columns: 78px minmax(0, 1fr) 52px; font-size: 11px; }
    .bar-row .num small { display: none; }
    #board { height: 172px; }
    .clock span { display: none; }
  }
  @media (max-width: 620px) { .chips .long { display: none; } .chips .short { display: inline; } .foot { display: none; } col.c-ves { width: 0; } .ves { padding: 0; font-size: 0; } col.c-route { width: 44%; } col.c-prog { width: 16%; } }
  @media (prefers-reduced-motion: reduce) { .draw, .fade { animation: none; stroke-dashoffset: 0; opacity: 1; } .clock i { animation: none; } .bar-row .fill, .prog i { transition: none; } }
</style>
</head>

    var svg = $('dailySvg'), box = $('dailyPlot').getBoundingClientRect(), W = Math.max(120, box.width), H = Math.max(80, box.height);
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H); svg.textContent = '';
    var s = series(), max = Math.max.apply(null, s), stepY = max > 3000 ? 1000 : max > 1200 ? 500 : 250, top = Math.ceil(max / stepY) * stepY;
    var L = 30, R = 8, T = 16, B = 18, pw = W - L - R, ph = H - T - B;
    function X(i) { return L + i / (N - 1) * pw; } function Y(v) { return T + ph - v / top * ph; }
    var defs = el('defs', {}, svg), gr = el('linearGradient', { id: 'area', x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
    el('stop', { offset: 0, 'stop-color': '#22a596', 'stop-opacity': 0.42 }, gr); el('stop', { offset: 1, 'stop-color': '#22a596', 'stop-opacity': 0.02 }, gr);
    for (var v = 0; v <= top; v += stepY) {
      el('line', { x1: L, x2: W - R, y1: Y(v), y2: Y(v), stroke: 'var(--grid)', 'stroke-width': 1 }, svg);
      var t = el('text', { x: L - 6, y: Y(v) + 3.5, 'text-anchor': 'end' }, svg); t.textContent = v >= 1000 ? (v / 1000) + 'k' : String(v);
    }
    days.forEach(function (d, i) {
      if (d.day === 1) { var tx = el('text', { x: X(i), y: H - 4, 'text-anchor': i === 0 ? 'start' : 'middle' }, svg); tx.textContent = MON[d.month]; el('line', { x1: X(i), x2: X(i), y1: T + ph, y2: T + ph + 3, stroke: 'var(--mute)', 'stroke-width': 1, opacity: 0.6 }, svg); }
    });
    var path = 'M' + s.map(function (vv, i) { return X(i).toFixed(1) + ' ' + Y(vv).toFixed(1); }).join('L');
    el('path', { d: path + 'L' + X(N - 1) + ' ' + Y(0) + 'L' + X(0) + ' ' + Y(0) + 'Z', fill: 'url(#area)', 'class': first && !reduce ? 'fade' : '' }, svg);
    var ln = el('path', { d: path, fill: 'none', stroke: 'var(--teal)', 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, svg);
    if (first && !reduce) { ln.style.setProperty('--len', Math.ceil(ln.getTotalLength())); ln.setAttribute('class', 'draw'); }
    var avg = sum(s) / N, ay = Y(avg);
    el('line', { x1: L, x2: W - R, y1: ay, y2: ay, stroke: 'var(--ink2)', 'stroke-width': 1, 'stroke-dasharray': '2 4', opacity: 0.55 }, svg);
    var at = el('text', { x: L + 4, y: ay - 5, 'text-anchor': 'start' }, svg); at.textContent = 'Average ' + fmt(avg); at.style.fill = 'var(--ink2)';
    var pk = 0; s.forEach(function (vv, i) { if (vv > s[pk]) pk = i; });
    var g = el('g', { 'class': first && !reduce ? 'fade' : '' }, svg);
    el('circle', { cx: X(pk), cy: Y(s[pk]), r: 5, fill: 'var(--amber)', stroke: 'var(--card)', 'stroke-width': 2 }, g);
    var right = X(pk) > W - 150, pt = el('text', { x: X(pk) + (right ? -10 : 10), y: Y(s[pk]) + 3.5, 'text-anchor': right ? 'end' : 'start' }, g);
    pt.textContent = 'Peak ' + fmt(s[pk]) + ' · ' + label(days[pk]); pt.style.fill = 'var(--ink)';
    var cross = el('line', { x1: 0, x2: 0, y1: T, y2: T + ph, stroke: 'var(--ink2)', 'stroke-width': 1, 'stroke-dasharray': '3 3', opacity: 0 }, svg);
    var dot = el('circle', { r: 4.5, fill: 'var(--teal-hi)', stroke: 'var(--card)', 'stroke-width': 2, opacity: 0 }, svg);
    geo = { L: L, pw: pw, X: X, Y: Y, s: s, avg: avg, cross: cross, dot: dot, left: box.left, top: box.top, W: W };
  }

  function ontime() {
    var svg = $('ontimeSvg'), box = $('ontimePlot').getBoundingClientRect(), W = Math.max(100, box.width), H = Math.max(70, box.height);
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H); svg.textContent = '';
    var vals = weeks.map(function (wk) { return wk.on / wk.run * 100; }), lo = Math.floor(Math.min.apply(null, vals) / 2) * 2 - 2, hi = 100;
    var L = 30, R = 10, T = 12, B = 18, pw = W - L - R, ph = H - T - B, n = vals.length;
    function X(i) { return L + (i + 0.5) / n * pw; } function Y(v) { return T + ph - (v - lo) / (hi - lo) * ph; }
    var stepY = (hi - lo) > 9 ? 4 : 2;
    for (var v = hi; v >= lo; v -= stepY) { el('line', { x1: L, x2: W - R, y1: Y(v), y2: Y(v), stroke: 'var(--grid)', 'stroke-width': 1 }, svg); var t = el('text', { x: L - 6, y: Y(v) + 3.5, 'text-anchor': 'end' }, svg); t.textContent = v + '%'; }
    weeks.forEach(function (wk, i) { if (wk.from.day <= 7) { var tx = el('text', { x: X(i), y: H - 4, 'text-anchor': 'middle' }, svg); tx.textContent = MON[wk.from.month]; } });
    var rate = onAll / runAll * 100;
    $('ontimeSub').textContent = 'All routes · dotted line is the season, ' + rate.toFixed(1) + '%';
    el('line', { x1: L, x2: W - R, y1: Y(rate), y2: Y(rate), stroke: 'var(--ink2)', 'stroke-width': 1, 'stroke-dasharray': '2 4', opacity: 0.55 }, svg);
    
    var d = 'M' + vals.map(function (vv, i) { return X(i).toFixed(1) + ' ' + Y(vv).toFixed(1); }).join('L');
    var ln = el('path', { d: d, fill: 'none', stroke: 'var(--teal)', 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, svg);
    if (first && !reduce) { ln.style.setProperty('--len', Math.ceil(ln.getTotalLength())); ln.setAttribute('class', 'draw'); }
    var low = 0; vals.forEach(function (vv, i) { if (vv < vals[low]) low = i; });
    var g = el('g', { 'class': first && !reduce ? 'fade' : '' }, svg);
    vals.forEach(function (vv, i) {
      var c = el('circle', { cx: X(i), cy: Y(vv), r: i === low ? 4.5 : 3, fill: i === low ? 'var(--amber)' : 'var(--teal)', stroke: 'var(--card)', 'stroke-width': 2 }, g);
      var hit = el('rect', { x: X(i) - pw / n / 2, y: T, width: pw / n, height: ph, fill: 'transparent' }, svg);
      function show() {
        var wk = weeks[i], rr = svg.getBoundingClientRect();
        tipShow(rr.left + X(i), rr.top + Y(vv), label(wk.from) + ' to ' + label(wk.to), vv.toFixed(1) + '% on time', fmt(wk.on) + ' of ' + fmt(wk.run) + ' sailings run', fmt(sum(wk.days.map(function (x) { return x.sched - x.run; }))) + ' cancelled', '');
        c.setAttribute('r', 5.5);
      }
      hit.addEventListener('pointerenter', show); hit.addEventListener('pointerdown', show);
      hit.addEventListener('pointerleave', function () { c.setAttribute('r', i === low ? 4.5 : 3); tipHide(); });
    });
    var lt = el('text', { x: X(low) + (low > n - 6 ? -9 : 9), y: Y(vals[low]) + 12, 'text-anchor': low > n - 6 ? 'end' : 'start' }, g); lt.textContent = 'Lowest ' + vals[low].toFixed(1) + '%'; lt.style.fill = 'var(--ink)';
  }

  var tip = $('tip');
  function tipShow(x, y, h, v, a, b, c) {
    $('tipH').textContent = h; $('tipV').textContent = v; $('tipA').textContent = a; $('tipB').textContent = b; $('tipC').textContent = c;
    var tw = tip.offsetWidth, th = tip.offsetHeight, vw = window.innerWidth, vh = window.innerHeight;
    var tx = x + 14, ty = y - th - 12;
    if (tx + tw > vw - 8) tx = x - tw - 14;
    if (ty < 8) ty = y + 14;
    if (ty + th > vh - 8) ty = vh - th - 8;
    tip.style.transform = 'translate3d(' + Math.round(Math.max(8, tx)) + 'px,' + Math.round(ty) + 'px,0)';
    tip.classList.add('on');
  }
  function tipHide() { tip.classList.remove('on'); }
  var plot = $('dailyPlot');
  function dailyMove(e) {
    var box = plot.getBoundingClientRect(), i = Math.round((e.clientX - box.left - geo.L) / geo.pw * (N - 1));
    i = Math.max(0, Math.min(N - 1, i));
    var d = days[i], v = geo.s[i], x = geo.X(i), y = geo.Y(v), diff = (v - geo.avg) / geo.avg * 100;
    geo.cross.setAttribute('x1', x); geo.cross.setAttribute('x2', x); geo.cross.setAttribute('opacity', 0.7);
    geo.dot.setAttribute('cx', x); geo.dot.setAttribute('cy', y); geo.dot.setAttribute('opacity', 1);
    tipShow(box.left + x, box.top + y, label(d), fmt(v) + ' riders', (diff >= 0 ? '+' : '') + diff.toFixed(0) + '% vs season average', d.weather + ' · ' + (d.ontime / d.run * 100).toFixed(1) + '% on time', DATA.notes[d.iso] || '');
  }
  plot.addEventListener('pointermove', dailyMove);
  plot.addEventListener('pointerdown', dailyMove);
  plot.addEventListener('pointerleave', function () { if (geo.cross) { geo.cross.setAttribute('opacity', 0); geo.dot.setAttribute('opacity', 0); } tipHide(); });

  function select(i) {
    sel = i;
    Array.prototype.forEach.call(chips.children, function (b, k) { b.setAttribute('aria-pressed', String(k === i + 1)); });
    bars.classList.toggle('has-sel', i >= 0);
    Array.prototype.forEach.call(bars.children, function (r, k) { r.classList.toggle('sel', k === i); });
    kpis(); daily();
  }

  var rowsEl = $('rows'), rowRefs = [];
  DATA.routes.forEach(function (r) {
    var tr = document.createElement('tr');
    function td(cls) { var c = document.createElement('td'); if (cls) c.className = cls; tr.appendChild(c); return c; }
    var a = td(''), code = document.createElement('span'); code.className = 'code'; code.textContent = r.code; var nm = document.createElement('b'); nm.textContent = r.name; a.appendChild(code); a.appendChild(nm);
    var nx = td('num'), inn = td('num'), ves = td('ves'), pr = td('r'), bar = document.createElement('span'), fill = document.createElement('i'); bar.className = 'prog'; bar.appendChild(fill); pr.appendChild(bar);
    rowsEl.appendChild(tr);
    rowRefs.push({ r: r, nx: nx, inn: inn, ves: ves, fill: fill, last: {} });
  });
  function mins(s) { var p = s.split(':'); return +p[0] * 60 + +p[1]; }
  function two(n) { return (n < 10 ? '0' : '') + n; }
  function setText(node, cache, key, v) { if (cache[key] !== v) { node.textContent = v; cache[key] = v; } }
  var clockEl = $('clock'), clockCache = {};
  function tick() {
    var now = new Date(), sec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
    setText(clockEl, clockCache, 't', two(now.getHours()) + ':' + two(now.getMinutes()) + ':' + two(now.getSeconds()));
    rowRefs.forEach(function (ref) {
      var r = ref.r, f = mins(r.first) * 60, l = mins(r.last) * 60, ev = r.every * 60, next, k = 0, running = true;
      if (sec <= f) { next = f; running = false; }
      else { k = Math.ceil((sec - f) / ev); next = f + k * ev; if (next > l) { next = f + 86400; k = 0; running = false; } }
      var rem = next - sec, nm = Math.floor((next % 86400) / 60);
      setText(ref.nx, ref.last, 'nx', two(Math.floor(nm / 60)) + ':' + two(nm % 60));
      var h = Math.floor(rem / 3600), m = Math.floor((rem % 3600) / 60), s = rem % 60;
      setText(ref.inn, ref.last, 'in', h ? h + ':' + two(m) + ':' + two(s) : two(m) + ':' + two(s));
      var soon = running && rem <= 120;
      if (ref.last.soon !== soon) { ref.inn.className = soon ? 'num soon' : 'num'; ref.last.soon = soon; }
      setText(ref.ves, ref.last, 'ves', r.vessels[k % r.vessels.length]);
      ref.fill.style.setProperty('--p', running ? Math.max(0, Math.min(1, 1 - rem / ev)).toFixed(4) : 0);
    });
  }
  var timer = 0;
  function startClock() { if (timer) return; tick(); timer = setInterval(tick, 1000); }
  function stopClock() { clearInterval(timer); timer = 0; }
  document.addEventListener('visibilitychange', function () { if (document.hidden) stopClock(); else startClock(); });

  function render() { if (!(window.innerWidth > 1)) return; kpis(); daily(); ontime(); first = false; }
  var pending = 0;
  window.addEventListener('resize', function () { if (pending) return; pending = requestAnimationFrame(function () { pending = 0; tipHide(); render(); }); });
  render(); startClock();
  window.__frames = 0;
})();
</script>
