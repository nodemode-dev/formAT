[package]
name = "format"
version = "0.24.5"
description = "Format desktop shell"
authors = ["nodemode-ai"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-shell = "2.3"
tauri-plugin-dialog = "2.4"
tauri-plugin-opener = "2.5"
tauri-plugin-updater = "2.9"
regex = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[profile.release.build-override]
strip = false
debug = false
